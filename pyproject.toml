[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtquant-big-convert"
version = "0.5.1"
description = "Big QMT RPC bridge and MiniQMT-compatible adapter layer (Valkey and serial)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "litaolemo"},
]
keywords = ["qmt", "quant", "trading", "rpc", "valkey", "bigqmt", "miniqmt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["python-dotenv>=1.0,<2"]

[project.optional-dependencies]
# Pin the supported client major. RPUSH is not idempotent (#245), so RPC
# connections also explicitly disable automatic retries.
valkey = ["valkey>=6.1,<7"]
serial = ["pyserial>=3.5,<4"]
# Faster/smaller wire encoding for whole-quote push (falls back to json if absent).
msgpack = ["msgpack>=1.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
bigqmt-init = "bigqmt_signal_trader.init_config:main"
bigqmt-serial-bridge = "bigqmt_signal_trader.serial_valkey_bridge:main"

[project.urls]
Homepage = "https://github.com/litaolemo/xtquant_big_convert"
Repository = "https://github.com/litaolemo/xtquant_big_convert.git"
Issues = "https://github.com/litaolemo/xtquant_big_convert/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "BIGQMT_VALKEY_DRYRUN",
    "bigqmt_signal_trader_strategy",
    "bigqmt_signal_trader_valkey_rpc_runtime",
    "bigqmt_signal_trader_valkey_dryrun",
    "bigqmt_signal_trader_dryrun",
    "bigqmt_signal_trader_diagnostic",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bigqmt_signal_trader*", "bigqmt_backtest*", "xtquant*"]

[tool.setuptools.package-data]
bigqmt_signal_trader = ["*.md", "_singlefile/*.txt"]
